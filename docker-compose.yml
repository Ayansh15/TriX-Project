services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: brandguard
      POSTGRES_USER: brandguard
      POSTGRES_PASSWORD: brandguard
    ports:
      - "5432:5432"
    volumes:
      - brandguard-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brandguard -d brandguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://brandguard:brandguard@postgres:5432/brandguard
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_MB: 20
    ports:
      - "8000:8000"
    volumes:
      - brandguard-uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  brandguard-postgres:
  brandguard-uploads:
