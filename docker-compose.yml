services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: brandguard
      POSTGRES_USER: brandguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brandguard-dev}
    volumes:
      - brandguard-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brandguard -d brandguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://brandguard:${POSTGRES_PASSWORD:-brandguard-dev}@postgres:5432/brandguard
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: 20
    ports:
      - "8000:8000"
    volumes:
      - brandguard-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  brandguard-postgres:
  brandguard-uploads:
